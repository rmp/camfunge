<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CamFunge</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f6e8ff; font: 13px -apple-system, system-ui, sans-serif; overflow: hidden; }
  #feed, #preview { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; display: none; }
  #feed.on, #preview.on { display: block; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 2em; font-size: 16px; pointer-events: none; white-space: pre-wrap; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
         padding: 10px 16px; border-radius: 28px; background: rgba(20, 0, 40, .62); backdrop-filter: blur(14px);
         box-shadow: 0 0 0 1px rgba(255, 120, 255, .25), 0 8px 40px rgba(0, 0, 0, .5); transition: opacity .3s; max-width: calc(100vw - 64px); }
  #bar.hidden { opacity: 0; pointer-events: none; }
  #bar h1 { margin: 0; font-size: 18px; font-weight: 900; letter-spacing: .04em;
            background: linear-gradient(90deg, #ff3cac, #ffcc00, #2bffcb, #784ba0); -webkit-background-clip: text; color: transparent; }
  #bar fieldset { border: 0; margin: 0; padding: 0; display: contents; }
  label { display: flex; gap: 6px; align-items: center; }
  select { background: rgba(0, 0, 0, .4); color: inherit; border: 1px solid rgba(255, 255, 255, .25); border-radius: 6px; padding: 3px 6px; max-width: 260px; }
  input[type=range] { width: 110px; accent-color: #ff3cac; }
  input[type=checkbox] { accent-color: #ff3cac; }
  button { background: rgba(255, 60, 172, .25); color: inherit; border: 1px solid rgba(255, 255, 255, .25); border-radius: 6px; padding: 3px 8px; font: inherit; }
  meter { width: 40px; }
  kbd { opacity: .6; font-size: 11px; }
  #conn { font-size: 11px; opacity: .85; white-space: nowrap; }
  #conn::before { content: '●'; margin-right: 4px; color: #888; }
  #conn[data-state=open]::before { color: #2bffcb; }
  #conn[data-state=connecting]::before { color: #ffcc00; }
  #note { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); font-size: 12px; padding: 4px 10px; border-radius: 6px;
          background: rgba(20, 0, 40, .7); opacity: 0; transition: opacity .4s; pointer-events: none; max-width: 80vw; text-align: center; }
  #note.on { opacity: 1; }
</style>
</head>
<body>
<video id="feed" muted playsinline></video>
<canvas id="preview"></canvas>
<div id="msg">Connecting to the CamFunge service…</div>
<div id="note"></div>
<nav id="bar">
  <h1>CamFunge</h1>
  <span id="conn" data-state="connecting">connecting</span>
  <fieldset id="controls" disabled>
    <label>Camera <select id="camera"></select></label>
    <label>Trip <select id="filter"></select></label>
    <label>Intensity <input id="intensity" type="range" min="0" max="1" step="0.01"></label>
    <label>Speed <input id="speed" type="range" min="0" max="3" step="0.01"></label>
    <label>React to <select id="reactTo"><option value="movement">Movement</option><option value="colour">Colour</option><option value="sound">Sound</option></select></label>
    <label>Reactivity <input id="reactivity" type="range" min="0" max="1" step="0.01"> <meter id="level" aria-label="Reaction level"></meter></label>
    <label><input id="autoCycle" type="checkbox"> Auto-cycle</label>
    <label title="Wave in the top-left or top-right corner to change trip"><input id="gestures" type="checkbox"> Wave to switch</label>
    <label title="Selfie view. Other apps may mirror your own preview again."><input id="mirror" type="checkbox"> Mirror</label>
    <button id="grabBg" type="button" title="Step out of shot first">Grab background</button>
  </fieldset>
  <label title="Virtual camera: watch the actual virtual-camera device other apps see. Direct: a preview streamed from the service.">View
    <select id="view"><option value="virtual">Virtual camera</option><option value="direct">Direct</option></select></label>
  <kbd>← → trip · B background · H hide</kbd>
</nav>
<script type="module" src="./app.js"></script>
</body>
</html>
