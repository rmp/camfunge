<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CamFunge</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f6e8ff; font: 13px -apple-system, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 2em; font-size: 16px; pointer-events: none; white-space: pre-wrap; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
         padding: 10px 16px; border-radius: 999px; background: rgba(20, 0, 40, .62); backdrop-filter: blur(14px);
         box-shadow: 0 0 0 1px rgba(255, 120, 255, .25), 0 8px 40px rgba(0, 0, 0, .5); transition: opacity .3s; max-width: calc(100vw - 64px); }
  #bar.hidden { opacity: 0; pointer-events: none; }
  #bar h1 { margin: 0; font-size: 18px; font-weight: 900; letter-spacing: .04em;
            background: linear-gradient(90deg, #ff3cac, #ffcc00, #2bffcb, #784ba0); -webkit-background-clip: text; color: transparent; }
  label { display: flex; gap: 6px; align-items: center; }
  select { background: rgba(0, 0, 0, .4); color: inherit; border: 1px solid rgba(255, 255, 255, .25); border-radius: 6px; padding: 3px 6px; max-width: 260px; }
  input[type=range] { width: 110px; accent-color: #ff3cac; }
  input[type=checkbox] { accent-color: #ff3cac; }
  meter { width: 40px; }
  kbd { opacity: .6; font-size: 11px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="video" muted playsinline></video>
<div id="msg">Waking the camera…</div>
<nav id="bar">
  <h1>CamFunge</h1>
  <label>Camera <select id="cam"></select></label>
  <label>Trip <select id="filter"></select></label>
  <label>Intensity <input id="amt" type="range" min="0" max="1" step="0.01" value="0.6"></label>
  <label>Speed <input id="speed" type="range" min="0" max="3" step="0.01" value="1"></label>
  <label>React to <select id="reactTo"><option value="movement">Movement</option><option value="colour">Colour</option></select></label>
  <label>Reactivity <input id="reactivity" type="range" min="0" max="1" step="0.01" value="0.5"> <meter id="level" aria-label="Reaction level"></meter></label>
  <label><input id="auto" type="checkbox"> Auto-cycle</label>
  <kbd>← → trip · H hide</kbd>
</nav>
<script type="module">
import { sceneSignal } from './reactivity.js';

const PRELUDE = `
precision highp float;
uniform sampler2D uCam, uPrev;
uniform vec2 uRes, uCamScale;
uniform float uTime, uAmt;
varying vec2 vUv;
vec3 cam(vec2 uv) { uv = (uv - 0.5) * uCamScale + 0.5; return texture2D(uCam, vec2(1.0 - uv.x, uv.y)).rgb; }
vec3 prev(vec2 uv) { return texture2D(uPrev, uv).rgb; }
float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
mat2 rot(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }
vec3 rgb2hsv(vec3 c) {
  vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + 1e-10)), d / (q.x + 1e-10), q.x);
}
vec3 hsv2rgb(vec3 c) { vec3 p = abs(fract(c.xxx + vec3(1.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0); return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y); }
vec3 palette(float t) { return 0.5 + 0.5 * cos(6.2831 * (t + vec3(0.0, 0.33, 0.67))); }
vec2 grad(vec2 uv) {
  vec2 e = 1.5 / uRes;
  return vec2(luma(cam(uv + vec2(e.x, 0.0))) - luma(cam(uv - vec2(e.x, 0.0))),
              luma(cam(uv + vec2(0.0, e.y))) - luma(cam(uv - vec2(0.0, e.y))));
}
`;

const FILTERS = [
  { name: 'Straight', artist: 'no filter', src: `gl_FragColor = vec4(cam(vUv), 1.0);` },

  { name: 'Lucy in the Sky', artist: 'The Beatles', src: `
    vec2 aspect = vec2(uRes.x / uRes.y, 1.0);
    vec2 p = (vUv - 0.5) * aspect;
    float r = length(p), seg = 6.2831 / (6.0 + floor(uAmt * 8.0));
    float a = abs(mod(atan(p.y, p.x) + uTime * 0.2, seg) - seg * 0.5);
    vec2 q = vec2(cos(a), sin(a)) * r * (1.0 + 0.2 * sin(uTime * 0.7));
    q += 0.04 * uAmt * vec2(sin(r * 14.0 - uTime * 2.0), cos(r * 11.0 + uTime));
    vec3 h = rgb2hsv(cam(q / aspect + 0.5));
    h.x = fract(h.x + r * uAmt * 1.5 + uTime * 0.08);
    h.y = min(1.0, h.y * 1.8 + 0.4 * uAmt);
    gl_FragColor = vec4(hsv2rgb(h), 1.0);` },

  { name: 'Magical Mystery Tour', artist: 'The Beatles', src: `
    float n = 2.0 + floor(uAmt * 2.99);
    vec2 cell = floor(vUv * n);
    vec2 uv = (fract(vUv * n) - 0.5) * (1.0 + 0.12 * sin(uTime * 1.5 + cell.x * 1.7 + cell.y * 2.3)) + 0.5;
    float l = floor(luma(cam(uv)) * 4.0) / 3.0;
    float hue = fract((cell.x + cell.y * n) / (n * n) + uTime * 0.05);
    vec3 ink = hsv2rgb(vec3(hue, 0.9, 1.0)), paper = hsv2rgb(vec3(fract(hue + 0.5), 0.8, 0.35));
    gl_FragColor = vec4(mix(paper, ink, l), 1.0);` },

  { name: 'Strawberry Fields', artist: 'The Beatles', src: `
    float drip = (0.5 + 0.5 * sin(vUv.x * 21.0 + uTime)) * (0.5 + 0.5 * sin(vUv.x * 57.0 - uTime * 0.6));
    vec3 c = cam(vUv + vec2(0.0, drip * 0.18 * uAmt * vUv.y));
    vec3 h = rgb2hsv(c);
    h.x = fract(mix(h.x, h.x < 0.5 ? 0.95 : 0.35, 0.5 * uAmt) + 0.03 * sin(uTime));
    h.y = min(1.0, h.y + 0.5 * uAmt);
    c = hsv2rgb(h);
    vec3 melted = prev(vUv + vec2(0.0, 0.003 + 0.004 * drip)) * 0.94;
    gl_FragColor = vec4(mix(c, max(c, melted), 0.75), 1.0);` },

  { name: 'Purple Haze', artist: 'Jimi Hendrix', src: `
    vec2 w = vec2(sin(vUv.y * 8.0 + uTime * 1.3) + sin(vUv.y * 3.0 - uTime),
                  cos(vUv.x * 7.0 - uTime * 1.1) + cos(vUv.x * 2.0 + uTime * 0.7));
    vec3 c = cam(vUv + w * 0.025 * uAmt);
    float l = luma(c);
    vec3 haze = mix(vec3(0.22, 0.0, 0.45), vec3(1.0, 0.45, 0.08), smoothstep(0.15, 0.85, l + 0.2 * sin(uTime + l * 8.0)));
    haze = mix(c, haze, 0.8);
    vec3 trail = prev(vUv + w * 0.003 - (vUv - 0.5) * 0.008) * (0.8 + 0.15 * uAmt);
    gl_FragColor = vec4(max(haze, trail), 1.0);` },

  { name: 'Electric Ladyland', artist: 'Jimi Hendrix', src: `
    vec2 g = grad(vUv);
    float e = smoothstep(0.03, 0.25, length(g));
    vec3 neon = hsv2rgb(vec3(fract(atan(g.y, g.x) / 6.2831 + uTime * 0.15), 1.0, 1.0)) * e * 1.6;
    vec3 c = cam(vUv);
    vec3 solar = abs(c - 0.5 + 0.5 * sin(uTime * 0.5)) * (1.0 - uAmt) * 0.6;
    gl_FragColor = vec4(max(neon + solar, prev(vUv) * (0.6 + 0.3 * uAmt)), 1.0);` },

  { name: 'Piece of My Heart', artist: 'Janis Joplin', src: `
    vec2 p = vUv - 0.5;
    float r = length(p);
    p = rot(uAmt * 4.0 * exp(-r * 4.0) * sin(uTime * 0.5)) * p;
    vec2 uv = p + 0.5;
    float l = luma(cam(uv));
    float band = floor(l * 5.0 + 0.6 * sin(uTime * 0.8 + r * 10.0));
    vec3 col = palette(band / 5.0 + uTime * 0.04);
    float ink = smoothstep(0.08, 0.2, length(grad(uv)));
    gl_FragColor = vec4(mix(col, vec3(0.08, 0.0, 0.1), ink * uAmt), 1.0);` },

  { name: 'Ball and Chain', artist: 'Janis Joplin', src: `
    vec2 aspect = vec2(uRes.x / uRes.y, 1.0);
    vec2 p = (vUv - 0.5) * aspect;
    float r = length(p), a = atan(p.y, p.x);
    float petals = 0.06 * uAmt * sin(a * 6.0 + uTime * 1.5) * sin(r * 20.0 - uTime * 3.0);
    vec3 c = cam((p * (1.0 + petals)) / aspect + 0.5);
    float rings = 0.5 + 0.5 * sin(r * 40.0 - uTime * 4.0 + luma(c) * 6.0);
    vec3 paisley = palette(luma(c) + r + uTime * 0.07);
    gl_FragColor = vec4(mix(c, paisley * (0.6 + 0.4 * rings), 0.35 + 0.6 * uAmt), 1.0);` },

  { name: 'Dark Side of the Moon', artist: 'Pink Floyd', src: `
    vec2 dir = vec2(cos(uTime * 0.3), sin(uTime * 0.3)) * 0.04 * uAmt;
    vec3 acc = vec3(0.0), wsum = vec3(0.0);
    for (int i = 0; i < 12; i++) {
      float f = float(i) / 11.0;
      vec3 s = hsv2rgb(vec3(f * 0.8, 1.0, 1.0));
      acc += cam(vUv + dir * (f - 0.5)) * s;
      wsum += s;
    }
    vec3 c = acc / wsum;
    c = pow(c, vec3(1.3)) * smoothstep(0.08, 0.35, luma(c));
    gl_FragColor = vec4(c * 1.3, 1.0);` },

  { name: 'Echoes', artist: 'Pink Floyd', src: `
    vec2 p = rot(0.02 + 0.04 * uAmt * sin(uTime * 0.4)) * (vUv - 0.5) * (0.97 - 0.04 * uAmt);
    vec3 h = rgb2hsv(prev(p + 0.5));
    h.x = fract(h.x + 0.03);
    h.y = min(1.0, h.y + 0.02);
    vec3 tunnel = hsv2rgb(h) * 0.985;
    vec3 c = cam(vUv);
    float edge = smoothstep(0.04, 0.2, length(grad(vUv)));
    gl_FragColor = vec4(mix(tunnel, c, max(edge, mix(0.3, 0.04, uAmt))), 1.0);` },

  { name: 'Dragula', artist: 'Rob Zombie', src: `
    float tick = floor(uTime * 12.0), line = floor(vUv.y * 90.0);
    float tear = step(0.92 - 0.25 * uAmt, hash(vec2(line, tick))) * (hash(vec2(tick, line + 1.0)) - 0.5) * 0.25 * uAmt;
    vec2 uv = vUv + vec2(tear, 0.0);
    float split = 0.012 * uAmt * (1.0 + sin(uTime * 7.0));
    vec3 c = vec3(cam(uv + vec2(split, 0.0)).r, cam(uv).g, cam(uv - vec2(split, 0.0)).b);
    float l = luma(c);
    vec3 toxic = l > 0.6 ? vec3(0.85, 1.0, 0.3) : l > 0.32 ? vec3(0.85, 0.0, 0.06) : vec3(0.02, 0.0, 0.02);
    c = mix(c, toxic, 0.5 + 0.5 * uAmt);
    c *= 0.82 + 0.18 * sin(vUv.y * uRes.y * 1.6);
    c += (hash(vUv * uRes + fract(uTime)) - 0.5) * 0.18;
    c *= (0.88 + 0.12 * hash(vec2(tick, 3.0))) * (1.0 - 0.9 * length(vUv - 0.5));
    gl_FragColor = vec4(c, 1.0);` },

  { name: 'Living Dead Girl', artist: 'Rob Zombie', src: `
    vec2 p = vUv - 0.5;
    float pulse = 0.5 + 0.5 * sin(uTime * 3.0);
    p *= 1.0 - 0.08 * uAmt * pulse * smoothstep(0.6, 0.0, length(p));
    vec3 c = cam(p + 0.5);
    float l = luma(c);
    vec3 duo = mix(vec3(0.0, 0.08, 0.05), vec3(0.6, 1.0, 0.75), smoothstep(0.2, 0.75, l));
    duo = mix(duo, vec3(1.0, 0.0, 0.15), step(0.97 - 0.15 * uAmt, hash(floor(vUv * 40.0) + floor(uTime * 6.0))) * step(l, 0.4));
    vec3 ghost = prev(vUv + vec2(0.002 * sin(uTime * 2.0), 0.0)) * 0.85;
    gl_FragColor = vec4(max(duo, ghost * uAmt), 1.0);` },
];

const BLIT = `gl_FragColor = vec4(prev(vUv), 1.0);`;
const VS = `attribute vec2 p; varying vec2 vUv; void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const $ = s => document.querySelector(s);
const canvas = $('#c'), video = $('#video'), msg = $('#msg'), bar = $('#bar');
const camSelect = $('#cam'), filterSelect = $('#filter'), amt = $('#amt'), speed = $('#speed'), auto = $('#auto');
const reactTo = $('#reactTo'), reactivity = $('#reactivity'), meter = $('#level');
const say = text => { msg.textContent = text; };

const gl = canvas.getContext('webgl2', { antialias: false });
const halfFloat = gl && gl.getExtension('EXT_color_buffer_float');

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function program(name, body) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  try {
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, `${PRELUDE}void main() {${body}}`));
  } catch (e) {
    throw new Error(`${name}: ${e.message}`);
  }
  gl.bindAttribLocation(p, 0, 'p');
  gl.linkProgram(p);
  const u = {};
  for (const n of ['uCam', 'uPrev', 'uRes', 'uCamScale', 'uTime', 'uAmt']) u[n] = gl.getUniformLocation(p, n);
  return { p, u };
}

function texture() {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
  return t;
}

let programs, blit, camTex, buffers, current = 0, read = 0, stream;

function setup() {
  programs = FILTERS.map(f => program(f.name, f.src));
  blit = program('blit', BLIT);
  camTex = texture();
  buffers = [0, 1].map(() => {
    const tex = texture(), fbo = gl.createFramebuffer();
    return { tex, fbo };
  });
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  FILTERS.forEach((f, i) => filterSelect.add(new Option(`${f.name} — ${f.artist}`, i)));
}

function resize() {
  const w = Math.round(canvas.clientWidth * devicePixelRatio), h = Math.round(canvas.clientHeight * devicePixelRatio);
  if (w === canvas.width && h === canvas.height) return;
  canvas.width = w;
  canvas.height = h;
  for (const b of buffers) {
    gl.bindTexture(gl.TEXTURE_2D, b.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, halfFloat ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, halfFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, b.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, b.tex, 0);
  }
}

function coverScale() {
  const canvasAspect = canvas.width / canvas.height, videoAspect = video.videoWidth / video.videoHeight;
  return canvasAspect > videoAspect ? [1, videoAspect / canvasAspect] : [canvasAspect / videoAspect, 1];
}

const probe = Object.assign(document.createElement('canvas'), { width: 64, height: 36 });
const probeCtx = probe.getContext('2d', { willReadFrequently: true });
function sampleVideo() {
  probeCtx.drawImage(video, 0, 0, probe.width, probe.height);
  return probeCtx.getImageData(0, 0, probe.width, probe.height).data;
}

function draw(prog, camScale, time, amount) {
  gl.useProgram(prog.p);
  gl.uniform1i(prog.u.uCam, 0);
  gl.uniform1i(prog.u.uPrev, 1);
  gl.uniform2f(prog.u.uRes, canvas.width, canvas.height);
  gl.uniform2fv(prog.u.uCamScale, camScale);
  gl.uniform1f(prog.u.uTime, time);
  gl.uniform1f(prog.u.uAmt, amount);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function selectFilter(i) {
  current = (i + FILTERS.length) % FILTERS.length;
  filterSelect.value = current;
  lastSwitch = performance.now();
}

let time = 0, last = performance.now(), lastSwitch = last, prevLuma = null, level = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = (now - last) / 1000;
  last = now;
  if (auto.checked && now - lastSwitch > 15000) selectFilter(current + 1);
  if (video.readyState < 2) return;

  const { signal, luma } = sceneSignal(sampleVideo(), prevLuma, reactTo.value);
  prevLuma = luma;
  level += (signal - level) * (signal > level ? 0.5 : 0.05);
  meter.value = level;
  const boost = +reactivity.value * level, amount = Math.min(1, +amt.value + boost);
  time += dt * +speed.value * (1 + 2 * boost);
  resize();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, camTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

  const out = buffers[1 - read], camScale = coverScale();
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.bindFramebuffer(gl.FRAMEBUFFER, out.fbo);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, buffers[read].tex);
  draw(programs[current], camScale, time, amount);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.bindTexture(gl.TEXTURE_2D, out.tex);
  draw(blit, camScale, time, amount);
  read = 1 - read;
}

async function listCameras() {
  const active = stream && stream.getVideoTracks()[0].getSettings().deviceId;
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  camSelect.replaceChildren(...cams.map((d, i) => new Option(d.label || `Camera ${i + 1}`, d.deviceId)));
  if (active) camSelect.value = active;
}

async function startCamera(deviceId) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: deviceId ? { ...size, deviceId: { exact: deviceId } } : size });
  } catch (e) {
    stream = null;
    say(`No camera feed: ${e.message}\n\nCheck System Settings → Privacy & Security → Camera.`);
    return;
  }
  video.srcObject = stream;
  await video.play();
  say('');
  await listCameras();
}

camSelect.onchange = () => startCamera(camSelect.value);
filterSelect.onchange = () => selectFilter(+filterSelect.value);
navigator.mediaDevices?.addEventListener('devicechange', listCameras);
addEventListener('keydown', e => {
  if (e.target.matches('select, input')) return;
  if (e.key === 'ArrowRight') selectFilter(current + 1);
  if (e.key === 'ArrowLeft') selectFilter(current - 1);
  if (e.key.toLowerCase() === 'h') bar.classList.toggle('hidden');
});

if (!gl) say('WebGL2 is not available in this webview.');
else if (!navigator.mediaDevices) say('Camera access is not available in this webview.');
else {
  try {
    setup();
    requestAnimationFrame(frame);
    startCamera();
  } catch (e) {
    say(e.message);
  }
}
</script>
</body>
</html>
